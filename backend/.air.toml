# .air.toml
root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/scopi-backend.exe ./cmd/api"
bin = "./tmp/scopi-backend.exe"
full_bin = ""
args = ["-config=config.json"]
delay = 1000 # ms
exclude_dir = ["assets", "tmp", "vendor"]
exclude_file = []
exclude_regexp = ["_test.go"]
log = "air_errors.log"
color = true
stop_on_error = true

[log]
time = false